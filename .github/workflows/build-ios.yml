name: Build iOS (unsigned, for Xcode/TestFlight signing)
on: [workflow_dispatch]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#c2185b' --splashBackgroundColor '#fff7fa'
      - run: npx cap sync ios
      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload && cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r BreastRisk-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: breast-risk-ios-unsigned
          path: ios/App/BreastRisk-unsigned.ipa
